name: release

# Pushing a tag vX.Y.Z builds the binaries on Apple Silicon (and cross-compiles the Linux and
# Windows ones), publishes a GitHub release with the archives install.sh and install.ps1
# download, and publishes the npm package agentic-emulator, which holds every platform's binaries. A tag with a
# suffix (v0.2.0-rc.1) is a prerelease on GitHub and goes to npm's "next" tag.
# Run it by hand (Actions > release > Run workflow) for a dry run: it builds and packages, and
# uploads the files as an artifact without publishing anything.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to package, e.g. v0.1.0-rc.1 (dry run: nothing is published)"
        required: true

permissions:
  contents: write # the GitHub release
  id-token: write # npm provenance and trusted publishing

jobs:
  release:
    runs-on: macos-15 # Apple Silicon
    timeout-minutes: 30
    env:
      VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
      PUBLISH: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: unit tests
        run: go test -count=1 ./...
      - name: build
        run: make build VERSION="$VERSION"
      - name: smoke test
        run: |
          export AGEMU_HOME="$(mktemp -d /tmp/agemu-release.XXXX)"
          bin/agemu version | grep -qx "agemu  $VERSION"
          bin/agemu profiles --platform ios | grep -q iphone-17-pro
          bin/agemu doctor > /dev/null || [ $? -eq 1 ]
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | bin/agemu mcp | grep -q '"name":"screenshot"'
          bin/agemu daemon stop
      - name: package
        run: scripts/package.sh "$VERSION" dist
      - uses: actions/upload-artifact@v4
        with:
          name: agemu-${{ env.VERSION }}
          path: dist/
      - name: GitHub release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        # A rerun (say after a failed npm publish) reuses the release and replaces its files.
        run: |
          if gh release view "$VERSION" > /dev/null 2>&1; then
            gh release upload "$VERSION" dist/*.tar.gz dist/*.zip dist/*.tgz dist/SHA256SUMS --clobber
          else
            pre=""; case "$VERSION" in *-*) pre="--prerelease";; esac
            gh release create "$VERSION" dist/*.tar.gz dist/*.zip dist/*.tgz dist/SHA256SUMS \
              --title "$VERSION" --generate-notes $pre
          fi
      - name: npm publish
        if: env.PUBLISH == 'true'
        # npm trusted publishing: npm authenticates this workflow (release.yml in this repository)
        # over OIDC, so no token is stored, and the package gets a provenance statement.
        run: |
          npm install -g npm@11 # trusted publishing needs npm 11.5+
          if [ "$(npm view "agentic-emulator@${VERSION#v}" version 2>/dev/null)" = "${VERSION#v}" ]; then
            echo "agentic-emulator@${VERSION#v} is already on npm"; exit 0
          fi
          tag="latest"; case "$VERSION" in *-*) tag="next";; esac
          # ./ matters: npm reads dist/x.tgz as the GitHub repository github.com/dist/x.tgz.
          npm publish ./dist/agentic-emulator-*.tgz --access public --provenance --tag "$tag"
