name: e2e-windows

# The Android end-to-end run (scripts/e2e-android.sh, in Git Bash) on a real emulator on Windows:
# GitHub's Windows runners expose the Windows Hypervisor Platform (WHPX), so the emulator runs the
# x86_64 system image accelerated. The probe app for the capability checks is built on Linux
# (testapps/android/build.sh is a bash script around the SDK's build tools and the NDK) and handed
# over as an artifact. It runs when Android or daemon code changes, and by hand.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "cmd/**"
      - "internal/android/**"
      - "internal/client/**"
      - "internal/daemon/**"
      - "internal/osproc/**"
      - "internal/toolchain/**"
      - "android-agent/**"
      - "scripts/e2e-android.sh"
      - "testapps/android/**"
      - ".github/workflows/e2e-windows.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: build the probe app for x86_64
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" > /dev/null
          AGEMU_PROBE_ABI=x86_64 testapps/android/build.sh "$PWD/agemu-probe.apk"
          unzip -l agemu-probe.apk | grep 'lib/x86_64/libprobe.so'
      - uses: actions/upload-artifact@v4
        with:
          name: probe-apk
          path: agemu-probe.apk
          retention-days: 3

  android:
    needs: probe
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      IMAGE: "system-images;android-37.1;google_apis_playstore_ps16k;x86_64"
      AGEMU_ANDROID_TIMEOUT_SCALE: "5" # nested virtualization and software rendering are slow
      AGEMU_E2E_TIMEOUT_SCALE: "6"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/download-artifact@v4
        with:
          name: probe-apk
      - name: install the emulator and the x86_64 system image
        run: |
          sm="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager.bat"
          yes | "$sm" --licenses > /dev/null || true
          "$sm" --install emulator platform-tools "$IMAGE" > /dev/null
          "$ANDROID_HOME/emulator/emulator.exe" -version | head -1
      - name: build (Android only)
        run: |
          go build -o bin/android/agemu.exe ./cmd/agemu
          go build -tags noios -o bin/android/agemud.exe ./cmd/agemud
      - name: doctor
        run: |
          export AGEMU_HOME="$RUNNER_TEMP/agemu-e2e"
          bin/android/agemu.exe doctor
      - name: e2e
        run: |
          export AGEMU_HOME="$RUNNER_TEMP/agemu-e2e"
          AGEMU_BIN="$PWD/bin/android/agemu.exe" AGEMU_E2E_PROBE_APK="$PWD/agemu-probe.apk" PYTHON=python \
            scripts/e2e-android.sh agemu-ci
      - name: logs
        if: failure()
        run: |
          tail -n 200 "$RUNNER_TEMP/agemu-e2e/daemon.log" || true
          tail -n 100 "$RUNNER_TEMP"/agemu-e2e/android/*.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-windows-logs
          path: |
            ${{ runner.temp }}/agemu-e2e/daemon.log
            ${{ runner.temp }}/agemu-e2e/android/*.log
          retention-days: 7
          if-no-files-found: ignore
